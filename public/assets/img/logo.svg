<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Alpacala Wireless">
  <defs>
    <linearGradient id="awg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="14" fill="url(#awg)"/>
  <!-- ears -->
  <ellipse cx="13.6" cy="14.5" rx="3.4" ry="5.6" fill="#ffffff"/>
  <ellipse cx="34.4" cy="14.5" rx="3.4" ry="5.6" fill="#ffffff"/>
  <!-- head -->
  <ellipse cx="24" cy="28" rx="14" ry="13" fill="#ffffff"/>
  <!-- fluffy top -->
  <circle cx="16.6" cy="15.6" r="4.6" fill="#ffffff"/>
  <circle cx="24" cy="13.4" r="5.6" fill="#ffffff"/>
  <circle cx="31.4" cy="15.6" r="4.6" fill="#ffffff"/>
  <!-- eyes -->
  <circle cx="18.6" cy="26" r="1.9" fill="url(#awg)"/>
  <circle cx="29.4" cy="26" r="1.9" fill="url(#awg)"/>
  <!-- muzzle -->
  <ellipse cx="24" cy="33.4" rx="5.4" ry="4" fill="url(#awg)"/>
  <!-- nostrils -->
  <circle cx="22.1" cy="32.8" r="0.9" fill="#ffffff"/>
  <circle cx="25.9" cy="32.8" r="0.9" fill="#ffffff"/>
  <!-- smile -->
  <path d="M21.6 35.6 Q24 37.6 26.4 35.6" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>
</svg>
